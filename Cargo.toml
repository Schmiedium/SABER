[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/Schmiedium/SABER"
publish = false

# Internal crates. Dependencies point downward only
# (docs/design/subsystems-and-interfaces.md §4).
[workspace.dependencies]
sim_schema = { path = "crates/sim_schema" }
sim_core = { path = "crates/sim_core" }
sim_models = { path = "crates/sim_models" }
sim_verify = { path = "crates/sim_verify", default-features = false }
sim_assets = { path = "crates/sim_assets" }
sim_studio_ui = { path = "crates/sim_studio_ui" }
sim_query = { path = "crates/sim_query" }
sim_testkit = { path = "crates/sim_testkit" }

# External crates. Anything that changes numerics (RNG, hashing) is pinned exactly, because
# exact state-hash goldens depend on it (verification-and-test-strategy.md §11).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
ron = "0.12.3"
blake3 = "=1.8.7"
rand_core = "=0.10.1"
rand_chacha = "=0.10.0"
# Bevy is pinned exactly and upgraded one minor at a time with determinism goldens (D11): sim_core
# shares bevy_ecs with the studio, and every upgrade is a new build (D1).
bevy_ecs = { version = "=0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_reflect = { version = "=0.20.1", default-features = false, features = ["std", "glam"] }
glam = { version = "0.33.12", features = ["serde"] }
# Collision detection (D13). Only `sim_core::geometry` imports it (IB-19); pinned exactly because a new
# version can move contact points, and it is part of `build_id`.
parry3d-f64 = { version = "=0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
# Pure-Rust erf/erfc for the inverse-CDF samplers (Tick 0 uncertainties); pinned like the RNG.
libm = "=0.2.16"
# On-disk tables (sim_schema `io` feature, step 3a). Arrow and Parquet follow sim_query's DataFusion
# release (55.2 uses 59.2), because the Parquet file format, not the crate version, is the contract.
arrow-schema = "59.2"
arrow-array = "59.2"
parquet = { version = "59.2", default-features = false, features = ["arrow", "zstd"] }
# Crash-dump frames (`*_crashes.zst`, IB-07): zstd around bincode, pinned because the bytes are on disk.
zstd = "0.13"
bincode = { version = "=2.0.1", default-features = false, features = ["std", "serde"] }
bytes = "1.12.1"
# MPI for sim_hpc's cluster runs (feature `mpi`); needs an MPI library and libclang to build.
mpi = { version = "0.8.2", default-features = false }
# campaign.toml (IB-04), read by sim_hpc.
toml = "1.1.8"
# SIGTERM/SIGINT in sim_hpc: a flag the main loop polls (step 4b; Unix only).
signal-hook = { version = "0.4.6", default-features = false }
# Test-only: exact rational arithmetic for the tableau order conditions.
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Determinism (verification-and-test-strategy.md §4.3, subsystems §10.1):
# never build the simulation with host-specific CPU features.
[profile.release]
codegen-units = 1
lto = "thin"

# Exact-arithmetic tableau tests (verification §5.4.1) are slow in an unoptimised build.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.num-integer]
opt-level = 3
