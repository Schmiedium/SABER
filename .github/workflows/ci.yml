# Per-PR tier (verification-and-test-strategy.md §10.1): fast checks only.
# CI data rule TD1: only synthetic or published data. No campaign or unpublished data, no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, dependency rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Data side builds without the kernel (sim_verify without `ecs`)
        run: cargo check -p sim_query -p sim_explorer --locked
      - run: ./scripts/check_dep_rules.sh

  python:
    name: Python (saber package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './python[test]'
      - run: pytest python

  end-to-end:
    name: End to end (Python drives sim_hpc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sim_hpc -p saber_cli --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './python[test]'
      - name: Tiny campaign from Python (build step 3c)
        env:
          SABER_SIM_HPC: ${{ github.workspace }}/target/debug/sim_hpc
          SABER_CLI: ${{ github.workspace }}/target/debug/saber-cli
          SABER_REQUIRE_BINARIES: "1"
        run: pytest python/tests/test_campaign_local.py

  reference-data:
    name: Reference data provenance (TD1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_refcase_provenance.py
