[package]
name = "sim_hpc"
description = "SABER headless campaign runner (local, or MPI with the mpi feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sim_core.workspace = true
sim_models.workspace = true
sim_verify = { workspace = true, features = ["ecs"] }
sim_schema = { workspace = true, features = ["io"] }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
toml.workspace = true
bincode.workspace = true
mpi = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[features]
# MPI cluster runs (IB-05). Needs an MPI library (OpenMPI or MPICH) and libclang to build; without
# it `sim_hpc` runs only with `--local`.
mpi = ["dep:mpi"]

[dev-dependencies]
bevy_ecs.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sim_hpc"
path = "src/main.rs"
