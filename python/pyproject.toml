[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saber"
version = "0.0.0"
description = "SABER sweep generation, campaign submission, analysis, verification and reports"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["saber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
